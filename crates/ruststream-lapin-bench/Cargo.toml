[package]
name = "ruststream-lapin-bench"
description = "The benchmarks of ruststream-lapin: the paired raw-versus-framework comparison and the code cost per message. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# A benchmark measures what ships, and the framework's harness feature changes the dispatch path:
# every delivery records what the handler saw and every handler call runs inside a task-local
# scope. Nothing here enables this; it exists so that asking for it is a compile error in every
# benchmark rather than a number nobody can trust.
testing = ["ruststream-lapin/testing"]

# The benchmarks live in their own package so that the measured binaries link the framework the
# way a service does. `ruststream-lapin`'s own dev-dependencies pull `ruststream/conformance`, which
# enables `ruststream/testing`, and a benchmark inside that package would be built against it.
[dev-dependencies]
# The code-cost benchmarks (`consume`, `reply`, `batch`): callgrind and DHAT through the runner the
# core pins.
gungraun = "=0.19.4"
ruststream-lapin.workspace = true
ruststream = { workspace = true, features = ["macros", "json"] }
lapin.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[[bench]]
name = "paired"
harness = false

# The code-cost benchmarks: one scenario per binary, each a service on the production broker
# against the stand. `just bench-code` runs them under valgrind; `benches/common` is the shared
# setup.
[[bench]]
name = "consume"
harness = false

[[bench]]
name = "reply"
harness = false

[[bench]]
name = "batch"
harness = false
