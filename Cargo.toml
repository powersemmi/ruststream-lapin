[workspace]
resolver = "3"
members = ["crates/ruststream-lapin", "crates/ruststream-lapin-bench"]
# cargo-generate scaffolds: their sources carry `{{project-name}}` placeholders that are not valid
# Rust/TOML until rendered, so they stay out of the workspace. The scaffold manifests are named
# `Cargo.toml.liquid` on top of that: git-source package discovery ignores `exclude` and parses
# every `Cargo.toml` in the repository.
exclude = ["templates"]

[workspace.package]
version = "0.7.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-lapin"
homepage = "https://powersemmi.github.io/ruststream-lapin/latest/"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-lapin = { path = "crates/ruststream-lapin" }

ruststream = { version = "0.7", default-features = false }
allocation-counter = "0.8.1"

lapin = { version = "4.12.1", default-features = false, features = ["tokio"] }
# The channel a live handle keeps is read on every publish and replaced only when the broker has
# closed it, so the read side must not synchronise.
arc-swap = "1.7"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
# Imports: a name is imported once, at the top of the file.
redundant_imports = "warn"
unused_import_braces = "warn"
# Dead and redundant code: casts, lifetimes and macro arms that change nothing.
closure_returning_async_block = "warn"
explicit_outlives_requirements = "warn"
impl_trait_redundant_captures = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_extern_crates = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
# Hidden behaviour: code that reads one way and runs another.
ambiguous_negative_literals = "warn"
deref_into_dyn_supertrait = "warn"
ffi_unwind_calls = "warn"
non_ascii_idents = "warn"
unstable_features = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
cognitive_complexity = "warn"
# Imports: a path is brought into scope with `use`, never spelled out inline.
absolute_paths = "warn"
alloc_instead_of_core = "warn"
unnecessary_self_imports = "warn"
# Panics: library code returns its errors; tests may unwrap.
unwrap_used = "warn"
unwrap_in_result = "warn"
missing_assert_message = "warn"
string_slice = "warn"
# Numbers: big endian, the network order, on the wire.
little_endian_bytes = "warn"
non_zero_suggestions = "warn"
# Idiomatic std: the shortest form that says what the code does.
map_with_unused_argument_over_ranges = "warn"
return_and_then = "warn"
deref_by_slicing = "warn"
if_then_some_else_none = "warn"
iter_over_hash_type = "warn"
create_dir = "warn"
filetype_is_file = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
pathbuf_init_then_push = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
verbose_file_reads = "warn"
# Unfinished and debugging code does not ship.
dbg_macro = "warn"
exit = "warn"
todo = "warn"
unimplemented = "warn"
# Numbers and casts say what they mean.
as_pointer_underscore = "warn"
as_underscore = "warn"
decimal_literal_representation = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
host_endian_bytes = "warn"
lossy_float_literal = "warn"
modulo_arithmetic = "warn"
precedence_bits = "warn"
suspicious_xor_used_as_pow = "warn"
# Memory and unsafe code, for any that a dependency's macro brings in.
default_union_representation = "warn"
inline_asm_x86_att_syntax = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# Errors are kept, not dropped.
pointer_format = "warn"
try_err = "warn"
unused_result_ok = "warn"
# Names and modules.
cfg_not_test = "warn"
disallowed_script_idents = "warn"
error_impl_error = "warn"
partial_pub_fields = "warn"
pub_without_shorthand = "warn"
redundant_test_prefix = "warn"
# Patterns and control flow.
mixed_read_write_in_expression = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_rest_pattern = "warn"
unneeded_field_pattern = "warn"
# Consistent style.
doc_paragraphs_missing_punctuation = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
large_include_file = "warn"
redundant_type_annotations = "warn"
semicolon_inside_block = "warn"

# What ships is optimized across crate boundaries: the framework is generic to the point where a
# dispatch path is only as cheap as the inlining it gets, and a build that stops at each crate
# boundary is not the one to publish numbers from.
[profile.release]
lto = "fat"

# The benchmarks measure what ships, so they are built the way a release is: the profile inherits
# it whole, and the only addition is the line tables a profile needs to name functions. Debug
# information is metadata and changes no codegen decision.
[profile.bench]
inherits = "release"
debug = "line-tables-only"
