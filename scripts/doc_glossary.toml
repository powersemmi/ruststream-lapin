# The lanes of `workers(n, by_key)`. The core calls a lane a partition; on a RabbitMQ page the
# word is qualified, because the broker's own hash routing splits a stream across queues.
[[term]]
en = "worker lane"
en_match = "(worker |keyed )?lanes?"
ru = "партиция воркеров"
ru_match = "партиц"
zh = "工作分区"
zh_match = "分区"

[[term]]
en = "partition key"
en_match = "partition keys?"
ru = "ключ партиционирования"
ru_match = "ключ\\w* партиционирования"
zh = "分区键"

