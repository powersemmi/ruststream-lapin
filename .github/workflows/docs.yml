name: Docs

on:
  push:
    branches: [main, "0.5.*"]
    paths: &docs-paths
      - docs/**
      - properdocs.yml
      - overrides/**
      - crates/ruststream-lapin/examples/**
      - scripts/lint_doc_fences.py
      - scripts/check_doc_i18n.py
      - scripts/check_doc_parity.py
      - scripts/doc_glossary.toml
      - .github/workflows/docs.yml
  # No base filter: a pull request stacked on another one has a branch for its base, and a filter
  # naming `main` leaves it with no checks at all - which reads as a conflicting branch rather
  # than as a workflow that declined to run.
  #
  # `labeled` / `unlabeled` are here for the translation-parity job below: applying its
  # escape-hatch label has to re-run the check, or the label leaves a stale red run blocking the
  # merge.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Lint doc code fences
        run: python3 scripts/lint_doc_fences.py

      - name: Check translated pages against their originals
        run: python3 scripts/check_doc_i18n.py

      - name: Build site (strict)
        run: properdocs build --strict

  translation-parity:
    name: Translation parity
    # The label is for an edit confined to one language: spelling, grammar, or a word choice
    # that was already right elsewhere. It suppresses this job only.
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'docs-single-language')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The rule is a diff rule, so the merge base with the target branch has to be
          # reachable.
          fetch-depth: 0

      # The base branch name reaches the shell through the environment, never through template
      # expansion: a fork can open a pull request from a branch whose name is shell syntax.
      - name: Check that an edit reached every language
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_doc_parity.py --base "origin/${BASE_REF}"
