name: CI

on:
  push:
    branches: [main, "0.5.*"]
  pull_request:
    branches: [main, "0.5.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, what users build with, and the early warning. Releases in between add
        # nothing: what fails on a later one fails on the floor too. Keep the floor in step
        # with `rust-version` in the workspace manifest.
        toolchain: [stable, beta, "1.88"]
    # Installing a toolchain does not select it: `rust-toolchain.toml` outranks the rustup
    # default the install action sets. RUSTUP_TOOLCHAIN outranks the file.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Advisory, not a gate: surfaces a lint added by the next clippy release six weeks before
      # it turns the build red.
      - name: cargo clippy (beta, advisory)
        if: matrix.toolchain == 'beta'
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features)
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test (in-process only, no live broker)
        run: cargo test --workspace --all-features

      # The crate-root missing_docs deny covers item docs; this gate catches what rustc
      # cannot: broken intra-doc links and redundant targets only rustdoc resolves.
      - name: cargo doc
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  features:
    name: Each feature alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      # Every feature of this crate is additive, and the all-features build hides a `cfg` that
      # only compiles because a neighbouring feature pulled the item in. --no-dev-deps: a
      # dev-dependency in scope masks a missing feature gate in the library.
      - name: cargo hack check (each feature)
        run: cargo hack check --workspace --each-feature --no-dev-deps

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly (resolver only)
        uses: dtolnay/rust-toolchain@nightly

      # The floor, for the build step below. Keep the version in step with `rust-version` in the
      # workspace manifest.
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The full flag rather than -Z direct-minimal-versions: the narrow one leaves the assembled
      # graph unverified, and that is what a user builds. It costs the pinning list below.
      - name: Resolve minimal versions
        run: cargo +nightly update -Z minimal-versions

      # Too-loose bounds in third-party manifests, all of them under the AMQP transport. Drop
      # each one when the crate that declares it moves its own floor.
      #
      # der-parser declares `num-bigint = "0.4"`, but 0.4.0 calls `div_ceil` by reference, which
      # stopped compiling when the inherent `u64::div_ceil` was stabilized.
      # native-tls declares `openssl = "0.10.29"`, and neither 0.10.29 nor its openssl-sys
      # predate OpenSSL 3, so the build script fails against the runner's libssl.
      # async-rs declares `tokio-stream = "0.1"` but imports `tokio_stream::wrappers`, added in
      # 0.1.2.
      # tcp-stream declares `native-tls = "0.2"` but calls `Identity::from_pkcs8`, added in
      # 0.2.9.
      - name: Pin dependencies whose declared bounds are too loose
        run: |
          cargo update -p num-bigint --precise 0.4.4
          cargo update -p openssl-sys --precise 0.9.107
          cargo update -p openssl --precise 0.10.72
          cargo update -p tokio-stream --precise 0.1.2
          cargo update -p native-tls --precise 0.2.9

      # Minimum dependencies on the minimum compiler: the worst case a user can assemble.
      # Resolution above needs nightly, so only this step drops to the floor.
      - name: Build and test against minimal versions
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --all-features --no-fail-fast

  broker-integration:
    name: "Broker integration (RabbitMQ)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `--wait` blocks until the healthcheck reports the node ready.
      - name: Start RabbitMQ
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run RabbitMQ integration tests
        env:
          AMQP_TEST_URL: amqp://127.0.0.1:5672
        run: cargo test -p ruststream-lapin --test integration_lapin -- --test-threads=1

      # run_suite in-process plus lifecycle, transactions (confirms and server tx), and
      # request/reply against the live node.
      - name: Run RabbitMQ conformance suite
        env:
          AMQP_TEST_URL: amqp://127.0.0.1:5672
        run: cargo test -p ruststream-lapin --features testing --test conformance_lapin -- --test-threads=1

      - name: Stop RabbitMQ
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  plugin-integration:
    name: "Plugin integration (RabbitMQ + plugins)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Builds the plugin-enabled image (consistent-hash + delayed-message-exchange) and waits
      # for it to be healthy.
      - name: Start the plugin-enabled RabbitMQ
        run: docker compose -f docker-compose.test.yml --profile plugins up -d --wait rabbitmq-plugins

      - name: Run plugin feature tests
        env:
          AMQP_PLUGINS_TEST_URL: amqp://127.0.0.1:5673
        run: cargo test -p ruststream-lapin --features plugin-consistent-hash,plugin-dme --test plugins_lapin -- --test-threads=1

      - name: Stop the plugin-enabled RabbitMQ
        if: always()
        run: docker compose -f docker-compose.test.yml --profile plugins down -v

  templates:
    name: Templates (render + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-generate
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate

      # The template-contract drift check: render each scaffold and compile it, so an API change
      # that breaks a template fails here, not a user's first `cargo build`. Compile-only, no live
      # broker. The rendered projects pin `ruststream-lapin` by version; patch it at this checkout
      # so the scaffolds build against the unreleased crate (`ruststream` itself is published).
      - name: Render and check the templates
        run: |
          for tpl in amqp-queue amqp-topic; do
            dest="$RUNNER_TEMP/$tpl"
            mkdir -p "$dest"
            cargo generate --path "templates/$tpl" \
              --name smoke --destination "$dest" --vcs none
            {
              echo ""
              echo "[patch.crates-io]"
              echo "ruststream-lapin = { path = \"$GITHUB_WORKSPACE/crates/ruststream-lapin\" }"
            } >> "$dest/smoke/Cargo.toml"
            cargo check --manifest-path "$dest/smoke/Cargo.toml"
          done

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        run: cargo deny check

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: codespell
        run: uvx codespell

      - name: zizmor
        run: uvx zizmor .github/workflows
